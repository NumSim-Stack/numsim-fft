name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Toolchain baseline: C++23 with std::expected (GCC >= 13, Clang >= 19).
          - { cxx: g++-13,     build_type: Debug }
          - { cxx: g++-14,     build_type: Release }
          - { cxx: clang++-19, build_type: Debug }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          if [[ "${{ matrix.cxx }}" == clang++-19 ]]; then
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update
            sudo apt-get install -y clang-19 libomp-19-dev
          else
            sudo apt-get install -y ${{ matrix.cxx }}
          fi
          sudo apt-get install -y cmake ninja-build libgtest-dev
      - name: Configure
        # No sibling checkouts on CI: every dependency is installed or fetched at its pin.
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DNUMSIM_PREFER_SIBLINGS=OFF
      - name: Build
        run: cmake --build build
      - name: Test (incl. ASan/UBSan and TSan variants)
        run: ctest --test-dir build --output-on-failure -j 4

  mpi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and Open MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 cmake ninja-build libgtest-dev libopenmpi-dev openmpi-bin
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_BUILD_TYPE=Release
          -DNUMSIM_FFT_ENABLE_MPI=ON
          -DNUMSIM_PREFER_SIBLINGS=OFF
      - name: Build
        run: cmake --build build
      - name: Test (1..4 ranks)
        run: ctest --test-dir build --output-on-failure -j 2

  # HPX is built from source (long); run on demand.
  hpx:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-13 cmake ninja-build libgtest-dev libboost-dev libhwloc-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_BUILD_TYPE=Release -DNUMSIM_FFT_ENABLE_HPX=ON -DNUMSIM_PREFER_SIBLINGS=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
